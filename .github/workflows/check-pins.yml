# Fails a PR that lists a plugin from outside Integral-Productivity without a
# commit pin. See devops-excellence ADR-097, decision 5.
name: Check plugin pins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Unit tests for the check
        run: node --test test/*.test.mjs
      - name: Check marketplace.json
        run: node scripts/check-external-pins.mjs
